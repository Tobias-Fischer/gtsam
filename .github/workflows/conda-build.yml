name: Conda build

# DIAGNOSTIC BRANCH. Measures the stack frame of Unit3::retract with the fix
# applied and precompiled headers left ON, to check the fix removes the cause
# rather than merely dropping the frame under the 1 MB Windows limit.

on:
  push:
    branches: [diag-fix-framesize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (frame size)
    runs-on: windows-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-fix-framesize
          restore-keys: sccache-win-64-

      - name: Configure
        run: pixi run -e test configure

      # Only the library: the PDB carries the frame sizes, no tests needed.
      - name: Build gtsam
        run: pixi run -e test cmake --build build --target gtsam

      - name: Measure the stack frames
        run: pixi exec --spec llvm-tools -- pwsh -NoProfile -File .github/diag/framesize.ps1

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-fix-framesize
