name: Conda build

# DIAGNOSTIC BRANCH. Stripped down to the one question being asked: do the 19
# Windows access violations survive with GTSAM_USE_TBB=OFF? win-64 only, C++
# tests only, no package build.

on:
  push:
    branches: [diag-tbb-off]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (TBB off)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      # Read-only: this build's objects differ from the real ones (no TBB), so
      # it must not write back over the branch caches.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            .sccache
          key: ccache-win-64-diag-tbb-off
          restore-keys: ccache-win-64-

      - name: Build GTSAM and the unit tests
        run: pixi run -e test build-tests

      - name: Run the C++ tests
        run: pixi run -e test test

      - name: Cache statistics
        if: always()
        run: pixi run -e test sccache --show-stats
        continue-on-error: true
