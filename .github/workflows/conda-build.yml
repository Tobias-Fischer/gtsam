name: Conda build

# DIAGNOSTIC BRANCH. Upstream's Windows CI passes with
# GTSAM_ALLOW_DEPRECATED_SINCE_V43=OFF; the conda build uses the default, ON,
# which adds an inline deprecated member to GTSAM_EXPORT class Unit3. Does the
# 19-test crash set survive with it off?

on:
  push:
    branches: [diag-no-deprecated]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (deprecated off)
    runs-on: windows-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-no-deprecated
          restore-keys: sccache-win-64-

      - name: Build GTSAM and the unit tests
        run: pixi run -e test build-tests

      - name: Run the C++ tests
        run: pixi run -e test test

      - name: Cache statistics
        if: always()
        run: pixi run -e test sccache --show-stats
        continue-on-error: true

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-no-deprecated
