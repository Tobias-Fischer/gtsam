name: Conda build

# DIAGNOSTIC BRANCH. The 19 failing Windows tests exit in ~0.1s having printed
# nothing, so they die before main runs -- at load or static-init time. This
# run gets the actual NTSTATUS, compares imports against exports in case the
# loader is refusing a symbol, and takes a symbolised stack under cdb.

on:
  push:
    branches: [diag-exitcode-v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (crash detail)
    runs-on: windows-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-v2
          restore-keys: sccache-win-64-

      # cdb is not on the runner image. Without it the fault code is all we get.
      - name: Install the Windows debugging tools
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2272610" -OutFile winsdksetup.exe
          Start-Process -FilePath .\winsdksetup.exe -ArgumentList "/features","OptionId.WindowsDesktopDebuggers","/quiet","/norestart" -Wait
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (Test-Path $cdb) { Write-Host "cdb installed" } else { Write-Host "cdb still missing" }
        continue-on-error: true

      # The debug-info flags live in cmake/CondaDefaults.cmake on this branch,
      # so this is the ordinary configure task: passing extra -D arguments here
      # gets them split by the shell.
      - name: Configure
        run: pixi run -e test configure

      # One crashing test and one passing test that also leans on Unit3.
      - name: Build the two tests
        run: pixi run -e test cmake --build build --target testUnit3 testRot3

      - name: Run them and report the fault
        run: pixi run -e test pwsh -NoProfile -File .github/diag/run-crash.ps1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: win64-crash-detail
          path: |
            imports.txt
            exports.txt
            build/bin/*.pdb
          if-no-files-found: warn

      - name: Cache statistics
        if: always()
        run: pixi run -e test sccache --show-stats
        continue-on-error: true

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-v2
