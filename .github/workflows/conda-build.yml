name: Conda build

# DIAGNOSTIC BRANCH. The failing tests crash in ~0.1s with no output, so the
# fault is at load or static-init time, not in a test body. This run gets the
# actual NTSTATUS and a stack instead of inferring from the ctest summary.

on:
  push:
    branches: [diag-exitcode]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (crash detail)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      # Restore-only, so a diagnostic build cannot overwrite the branch caches.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            .sccache
          key: ccache-win-64-diag-exitcode
          restore-keys: ccache-win-64-

      - name: Configure
        run: pixi run -e test configure

      # One crashing test and one passing test that also uses Unit3 heavily,
      # rather than the whole suite.
      - name: Build the two tests
        run: pixi run -e test cmake --build build --target testUnit3 testRot3

      - name: Run them and report the fault
        run: pixi run -e test pwsh -NoProfile -File .github/diag/run-crash.ps1

      - name: Cache statistics
        if: always()
        run: pixi run -e test sccache --show-stats
        continue-on-error: true
