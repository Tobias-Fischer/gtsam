name: Conda build

# DIAGNOSTIC BRANCH. Tests whether compiling Unit3.cpp without the precompiled
# header removes the 3 MB stack frame, keeping PCH on everywhere else. Reports
# the frame size and then runs the full suite, so a pass is backed by a number.

on:
  push:
    branches: [diag-pch-textual]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (textual force-include)
    runs-on: windows-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-pch-textual
          restore-keys: sccache-win-64-

      - name: Configure
        run: pixi run -e test configure

      - name: Build gtsam
        run: pixi run -e test cmake --build build --target gtsam

      - name: Measure the stack frames
        run: pixi exec --spec llvm-tools -- pwsh -NoProfile -File .github/diag/framesize.ps1

      - name: Build the unit tests
        run: pixi run -e test build-tests

      - name: Run the C++ tests
        run: pixi run -e test test

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .sccache
          key: sccache-win-64-diag-pch-textual
