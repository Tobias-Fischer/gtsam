name: Conda build

# DIAGNOSTIC BRANCH. Unit3::operator= now takes B_mutex_ before resetting the
# caches that basis() fills under the same lock. win-64 only, C++ tests only.

on:
  push:
    branches: [diag-lock-assign]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win-64 (locked operator=)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true

      # Restore-only, so a diagnostic build cannot overwrite the branch caches.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            .sccache
          key: ccache-win-64-diag-lock-assign
          restore-keys: ccache-win-64-

      - name: Build GTSAM and the unit tests
        run: pixi run -e test build-tests

      - name: Run the C++ tests
        run: pixi run -e test test

      - name: Cache statistics
        if: always()
        run: pixi run -e test sccache --show-stats
        continue-on-error: true
